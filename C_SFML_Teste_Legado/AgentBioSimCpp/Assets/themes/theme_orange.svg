<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1696 954" width="1696" height="954">
  <defs>
    <linearGradient id="bgGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F69049"></stop>
      <stop offset="38%" stop-color="#F36A3E"></stop>
      <stop offset="72%" stop-color="#F0533F"></stop>
      <stop offset="100%" stop-color="#ED4A57"></stop>
    </linearGradient>
    <radialGradient id="dishGrad" cx="48%" cy="42%" r="62%">
