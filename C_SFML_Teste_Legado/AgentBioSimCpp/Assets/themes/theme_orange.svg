      <stop offset="65%" stop-color="#F8A06A" stop-opacity="0.5"></stop>
      <stop offset="100%" stop-color="#F4905C" stop-opacity="0.42"></stop>
    </radialGradient>
    <radialGradient id="orbPink" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#FBAFC6" stop-opacity="0.6"></stop>
      <stop offset="55%" stop-color="#F98E84" stop-opacity="0.42"></stop>
      <stop offset="86%" stop-color="#F8954E" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#F8954E" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="orbOrange" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFC67E" stop-opacity="0.55"></stop>
      <stop offset="55%" stop-color="#FBA258" stop-opacity="0.36"></stop>
      <stop offset="86%" stop-color="#F58840" stop-opacity="0.14"></stop>
      <stop offset="100%" stop-color="#F58840" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="orbRose" cx="42%" cy="40%" r="60%">
