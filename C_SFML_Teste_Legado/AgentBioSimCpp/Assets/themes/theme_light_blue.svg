<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1696 954" width="1696" height="954">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35CFC2"></stop>
      <stop offset="34%" stop-color="#45C3D2"></stop>
      <stop offset="70%" stop-color="#5A93DD"></stop>
      <stop offset="100%" stop-color="#6C84D8"></stop>
    </linearGradient>
    <radialGradient id="dishGrad" cx="48%" cy="42%" r="62%">
