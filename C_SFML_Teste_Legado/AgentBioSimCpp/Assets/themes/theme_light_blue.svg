    <circle cx="858" cy="480" r="406" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"></circle>
    <circle cx="858" cy="480" r="396" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6"></circle>
