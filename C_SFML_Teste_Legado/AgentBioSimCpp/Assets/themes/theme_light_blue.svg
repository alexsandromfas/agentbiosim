      <stop offset="55%" stop-color="#9C86DE" stop-opacity="0.42"></stop>
      <stop offset="86%" stop-color="#8474D4" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#8474D4" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="orbBlue" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#A7CBF2" stop-opacity="0.52"></stop>
      <stop offset="55%" stop-color="#86A8E6" stop-opacity="0.34"></stop>
      <stop offset="86%" stop-color="#6E8FE0" stop-opacity="0.14"></stop>
      <stop offset="100%" stop-color="#6E8FE0" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="orbLavender" cx="42%" cy="40%" r="60%">
