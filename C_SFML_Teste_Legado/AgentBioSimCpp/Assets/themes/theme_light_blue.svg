      <stop offset="65%" stop-color="#BBDDF0" stop-opacity="0.44"></stop>
      <stop offset="100%" stop-color="#A8D0EA" stop-opacity="0.38"></stop>
    </radialGradient>
    <radialGradient id="orbPurple" cx="42%" cy="36%" r="60%">
